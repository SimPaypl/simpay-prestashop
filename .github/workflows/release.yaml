name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP with composer v2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install composer dependencies
        run: composer install --no-dev

      - name: Prepare zip package
        run: |
          set -e
          ZIP="simpay-prestashop.zip"
          mkdir -p simpay
          cp -r config controllers mails src translations upgrade views vendor composer.json composer.lock config.xml index.php LICENSE logo.png simpay.php simpay
          zip -r "${ZIP}" simpay
          sha256sum "${ZIP}"

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: "${{ github.ref_name }}"
          name: "${{ github.ref_name }}"
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            simpay-prestashop.zip
      

